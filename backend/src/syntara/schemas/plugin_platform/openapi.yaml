---
openapi: 3.1.0
info:
  title: Syntara Plugin Platform API
  version: 1.0.0
  description: |
    APIs for configuring local plugin catalog sources, reading accepted local
    plugin catalog projections, and inspecting the active installed registry.

    Source configuration contains opaque references to credentials, trust
    policies, and optional custom CA material. It never contains secret values.
    Catalog and installed-registry reads return only immutable, accepted local
    projections and never contact a registry or expose resolved credentials.

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: Plugin Platform
    description: Plugin catalog source administration and verified discovery

paths:
  /plugin_sources:
    post:
      summary: Create plugin catalog source
      description: Register non-secret local catalog-source configuration.
      operationId: create_plugin_source
      tags:
        - Plugin Platform
      x-app-permission:
        resource: plugin_source
        action: create
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PluginSourceCreate"
      responses:
        "201":
          description: Plugin catalog source created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginSourceRead"
        "400": &bad_request
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/BadRequestError"
        "401": &unauthorized
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/UnauthorizedError"
        "403": &forbidden
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ForbiddenError"
        "404": &not_found
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/NotFoundError"
        "409": &conflict
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ConflictError"
        "422": &validation_error
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/ValidationError"
        "429": &rate_limit
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/RateLimitError"
        "500": &internal_error
          $ref: "../base/shared-resources.openapi.yaml#/components/responses/InternalServerError"
    get:
      summary: List plugin catalog sources
      description: List administrator-visible catalog sources with cursor pagination.
      operationId: list_plugin_sources
      tags:
        - Plugin Platform
      x-app-permission:
        resource: plugin_source
        action: read
      security:
        - bearerAuth: []
      parameters:
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/limitParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/cursorParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/sortParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam"
        - name: source_id
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Source Id
        - name: display_name
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Display Name
        - name: channel
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Channel
        - name: enabled
          in: query
          required: false
          schema:
            anyOf:
              - type: boolean
              - type: "null"
            title: Enabled
      responses:
        "200":
          description: Paginated plugin catalog sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginSourceListResponse"
        "400": *bad_request
        "401": *unauthorized
        "403": *forbidden
        "404": *not_found
        "409": *conflict
        "422": *validation_error
        "429": *rate_limit
        "500": *internal_error

  /plugin_sources/{plugin_source_id}:
    get:
      summary: Get plugin catalog source
      description: Get non-secret source configuration by resource ID.
      operationId: get_plugin_source
      tags:
        - Plugin Platform
      x-app-permission:
        resource: plugin_source
        action: read
      security:
        - bearerAuth: []
      parameters: &source_id_parameter
        - name: plugin_source_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Plugin Source Id
      responses:
        "200":
          description: Plugin catalog source details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginSourceRead"
        "400": *bad_request
        "401": *unauthorized
        "403": *forbidden
        "404": *not_found
        "409": *conflict
        "422": *validation_error
        "429": *rate_limit
        "500": *internal_error
    patch:
      summary: Update plugin catalog source
      description: Update source settings without changing its signed-index identity.
      operationId: update_plugin_source
      tags:
        - Plugin Platform
      x-app-permission:
        resource: plugin_source
        action: update
      security:
        - bearerAuth: []
      parameters: *source_id_parameter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PluginSourceUpdate"
      responses:
        "200":
          description: Updated plugin catalog source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginSourceRead"
        "400": *bad_request
        "401": *unauthorized
        "403": *forbidden
        "404": *not_found
        "409": *conflict
        "422": *validation_error
        "429": *rate_limit
        "500": *internal_error
    delete:
      summary: Delete plugin catalog source
      description: Remove discovery configuration and projections without uninstalling content.
      operationId: delete_plugin_source
      tags:
        - Plugin Platform
      x-app-permission:
        resource: plugin_source
        action: delete
      security:
        - bearerAuth: []
      parameters: *source_id_parameter
      responses:
        "204":
          description: Plugin catalog source deleted
        "400": *bad_request
        "401": *unauthorized
        "403": *forbidden
        "404": *not_found
        "409": *conflict
        "422": *validation_error
        "429": *rate_limit
        "500": *internal_error

  /plugin_sources/{plugin_source_id}/reconcile:
    post:
      summary: Reconcile plugin catalog source
      description: |-
        Discover an OCI catalog index through the explicitly enabled local-PoC
        path.

        The local mode reconciles discovery metadata only. It cannot be used to
        fetch plugin payloads, install plugins, or start a workload.
      operationId: reconcile_plugin_source
      tags:
        - Plugin Platform
      x-app-permission:
        resource: plugin_source
        action: reconcile
      security:
        - bearerAuth: []
      parameters: *source_id_parameter
      responses:
        "200":
          description: Safe result of catalog-source reconciliation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginSourceReconciliationRead"
        "400": *bad_request
        "401": *unauthorized
        "403": *forbidden
        "404": *not_found
        "409": *conflict
        "422": *validation_error
        "429": *rate_limit
        "500": *internal_error
        "503":
          description: Catalog source reconciliation is unavailable until a trusted source reconciler is configured.
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"

  /plugin_sources/{plugin_source_id}/disable:
    post:
      summary: Disable plugin catalog source
      description: Stop future discovery while retaining the source's historical evidence.
      operationId: disable_plugin_source
      tags:
        - Plugin Platform
      x-app-permission:
        resource: plugin_source
        action: disable
      security:
        - bearerAuth: []
      parameters: *source_id_parameter
      responses:
        "200":
          description: Disabled plugin catalog source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginSourceRead"
        "400": *bad_request
        "401": *unauthorized
        "403": *forbidden
        "404": *not_found
        "409": *conflict
        "422": *validation_error
        "429": *rate_limit
        "500": *internal_error

  /plugin_sources/{plugin_source_id}/enable:
    post:
      summary: Enable plugin catalog source
      description: Allow future reconciliation for an existing source.
      operationId: enable_plugin_source
      tags:
        - Plugin Platform
      x-app-permission:
        resource: plugin_source
        action: enable
      security:
        - bearerAuth: []
      parameters: *source_id_parameter
      responses:
        "200":
          description: Enabled plugin catalog source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginSourceRead"
        "400": *bad_request
        "401": *unauthorized
        "403": *forbidden
        "404": *not_found
        "409": *conflict
        "422": *validation_error
        "429": *rate_limit
        "500": *internal_error

  /plugin_registry:
    get:
      summary: List installed plugins
      description: List the safe current registry snapshot without reaching an OCI registry.
      operationId: list_installed_plugins
      tags:
        - Plugin Platform
      x-app-permission:
        resource: plugin_registry
        action: read
      security:
        - bearerAuth: []
      parameters:
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/limitParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/cursorParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/sortParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam"
        - name: namespace
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                minLength: 1
                maxLength: 63
              - type: "null"
            title: Namespace
        - name: name
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                minLength: 1
                maxLength: 63
              - type: "null"
            title: Name
        - name: version
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                minLength: 5
                maxLength: 128
              - type: "null"
            title: Version
        - name: enabled
          in: query
          required: false
          schema:
            anyOf:
              - type: boolean
              - type: "null"
            title: Enabled
      responses:
        "200":
          description: Paginated plugins in the active installed registry generation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstalledPluginListResponse"
        "400": *bad_request
        "401": *unauthorized
        "403": *forbidden
        "404": *not_found
        "409": *conflict
        "422": *validation_error
        "429": *rate_limit
        "500": *internal_error

  /plugin_registry/{namespace}/{name}/versions/{version}:
    get:
      summary: Get installed plugin
      description: Read a current plugin revision's safe workflow action contracts.
      operationId: get_installed_plugin
      tags:
        - Plugin Platform
      x-app-permission:
        resource: plugin_registry
        action: read
      security:
        - bearerAuth: []
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 63
            pattern: "^[a-z][a-z0-9-]{0,62}$"
            title: Namespace
        - name: name
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 63
            pattern: "^[a-z][a-z0-9-]{0,62}$"
            title: Name
        - name: version
          in: path
          required: true
          schema:
            type: string
            minLength: 5
            maxLength: 128
            pattern: "^(?:0|[1-9][0-9]*)\\.[0-9]+\\.[0-9]+(?:-[0-9A-Za-z.-]+)?$"
            title: Version
      responses:
        "200":
          description: One installed plugin and its active action contracts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstalledPluginDetailRead"
        "400": *bad_request
        "401": *unauthorized
        "403": *forbidden
        "404": *not_found
        "409": *conflict
        "422": *validation_error
        "429": *rate_limit
        "500": *internal_error

  /catalog/plugins:
    get:
      summary: List catalog plugins
      description: List plugins from the immutable active snapshots of enabled sources.
      operationId: list_catalog_plugins
      tags:
        - Plugin Platform
      x-app-permission:
        resource: plugin_catalog
        action: read
      security:
        - bearerAuth: []
      parameters:
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/limitParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/cursorParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/sortParam"
        - $ref: "../base/shared-resources.openapi.yaml#/components/parameters/includeTotalParam"
        - name: source_id
          in: query
          required: false
          description: Optional stable catalog source identity.
          schema:
            anyOf:
              - type: string
                minLength: 1
                maxLength: 63
              - type: "null"
            title: Source Id
        - name: namespace
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                minLength: 1
                maxLength: 63
              - type: "null"
            title: Namespace
        - name: name
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                minLength: 1
                maxLength: 63
              - type: "null"
            title: Name
        - name: version
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                minLength: 5
                maxLength: 128
              - type: "null"
            title: Version
        - name: runtime_ownership
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                enum:
                  - platform-runner
                  - custom-workload
              - type: "null"
            title: Runtime Ownership
        - name: deprecated
          in: query
          required: false
          schema:
            anyOf:
              - type: boolean
              - type: "null"
            title: Deprecated
        - name: withdrawn
          in: query
          required: false
          schema:
            anyOf:
              - type: boolean
              - type: "null"
            title: Withdrawn
      responses:
        "200":
          description: Paginated visible catalog plugin versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogPluginListResponse"
        "400": *bad_request
        "401": *unauthorized
        "403": *forbidden
        "404": *not_found
        "409": *conflict
        "422": *validation_error
        "429": *rate_limit
        "500": *internal_error

  /catalog/plugins/{namespace}/{name}:
    get:
      summary: Get catalog plugin
      description: Inspect all active, source-qualified versions of one catalog plugin.
      operationId: get_catalog_plugin
      tags:
        - Plugin Platform
      x-app-permission:
        resource: plugin_catalog
        action: read
      security:
        - bearerAuth: []
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 63
            pattern: "^[a-z][a-z0-9-]{0,62}$"
            title: Namespace
        - name: name
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 63
            pattern: "^[a-z][a-z0-9-]{0,62}$"
            title: Name
      responses:
        "200":
          description: Visible versions of one catalog plugin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogPluginDetailRead"
        "400": *bad_request
        "401": *unauthorized
        "403": *forbidden
        "404": *not_found
        "409": *conflict
        "422": *validation_error
        "429": *rate_limit
        "500": *internal_error

  /catalog/plugins/{namespace}/{name}/versions/{version}:
    get:
      summary: Get catalog plugin version
      description: Inspect one version; require source selection if active sources conflict.
      operationId: get_catalog_plugin_version
      tags:
        - Plugin Platform
      x-app-permission:
        resource: plugin_catalog
        action: read
      security:
        - bearerAuth: []
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 63
            pattern: "^[a-z][a-z0-9-]{0,62}$"
            title: Namespace
        - name: name
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 63
            pattern: "^[a-z][a-z0-9-]{0,62}$"
            title: Name
        - name: version
          in: path
          required: true
          schema:
            type: string
            minLength: 5
            maxLength: 128
            pattern: "^(?:0|[1-9][0-9]*)\\.[0-9]+\\.[0-9]+(?:-[0-9A-Za-z.-]+)?$"
            title: Version
        - name: source_id
          in: query
          required: false
          description: Optional stable catalog source ID.
          schema:
            anyOf:
              - type: string
                minLength: 1
                maxLength: 63
                pattern: "^[a-z][a-z0-9-]{0,62}$"
              - type: "null"
            title: Source Id
      responses:
        "200":
          description: One visible immutable catalog plugin version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogPluginRead"
        "400": *bad_request
        "401": *unauthorized
        "403": *forbidden
        "404": *not_found
        "409": *conflict
        "422": *validation_error
        "429": *rate_limit
        "500": *internal_error

  /catalog/plugins/{namespace}/{name}/versions/{version}/documentation:
    get:
      summary: Get catalog plugin documentation
      description: Read previously admitted, sanitized documentation without contacting a registry.
      operationId: get_catalog_plugin_documentation
      tags:
        - Plugin Platform
      x-app-permission:
        resource: plugin_catalog
        action: read
      security:
        - bearerAuth: []
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 63
            pattern: "^[a-z][a-z0-9-]{0,62}$"
            title: Namespace
        - name: name
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 63
            pattern: "^[a-z][a-z0-9-]{0,62}$"
            title: Name
        - name: version
          in: path
          required: true
          schema:
            type: string
            minLength: 5
            maxLength: 128
            pattern: "^(?:0|[1-9][0-9]*)\\.[0-9]+\\.[0-9]+(?:-[0-9A-Za-z.-]+)?$"
            title: Version
        - name: source_id
          in: query
          required: false
          description: Optional stable catalog source ID.
          schema:
            anyOf:
              - type: string
                minLength: 1
                maxLength: 63
                pattern: "^[a-z][a-z0-9-]{0,62}$"
              - type: "null"
            title: Source Id
      responses:
        "200":
          description: Sanitized documentation for one visible immutable catalog plugin version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogPluginDocumentationRead"
        "400": *bad_request
        "401": *unauthorized
        "403": *forbidden
        "404": *not_found
        "409": *conflict
        "422": *validation_error
        "429": *rate_limit
        "500": *internal_error

  /catalog/plugins/{namespace}/{name}/versions/{version}/documentation/hydrate:
    post:
      summary: Hydrate catalog plugin documentation
      description: |
        Persist safe documentation for one source-selected, digest-pinned plugin.

        The browser supplies only the visible catalog identity. The service derives
        registry location, artifact digest, and trust configuration from the
        accepted server-side catalog projection; it never accepts a URL, token, or
        artifact reference from the caller.
      operationId: hydrate_catalog_plugin_documentation
      tags:
        - Plugin Platform
      x-app-permission:
        resource: plugin_catalog
        action: hydrate_documentation
      security:
        - bearerAuth: []
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 63
            pattern: "^[a-z][a-z0-9-]{0,62}$"
            title: Namespace
        - name: name
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 63
            pattern: "^[a-z][a-z0-9-]{0,62}$"
            title: Name
        - name: version
          in: path
          required: true
          schema:
            type: string
            minLength: 5
            maxLength: 128
            pattern: "^(?:0|[1-9][0-9]*)\\.[0-9]+\\.[0-9]+(?:-[0-9A-Za-z.-]+)?$"
            title: Version
        - name: source_id
          in: query
          required: true
          description: Stable catalog source identity selected by the administrator.
          schema:
            type: string
            minLength: 1
            maxLength: 63
            pattern: "^[a-z][a-z0-9-]{0,62}$"
            description: Stable catalog source identity selected by the administrator.
            title: Source Id
      responses:
        "200":
          description: Result of verifying and safely rendering catalog plugin documentation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogPluginDocumentationHydrationRead"
        "400": *bad_request
        "401": *unauthorized
        "403": *forbidden
        "404": *not_found
        "409": *conflict
        "422": *validation_error
        "429": *rate_limit
        "500": *internal_error
        "503":
          description: Catalog documentation hydration is unavailable until trusted adapters are configured.
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"

  /catalog/plugins/{namespace}/{name}/versions/{version}/install:
    post:
      summary: Install catalog plugin
      description: |
        Install exactly one active catalog version through trusted server-owned adapters.

        The browser supplies only the visible catalog identity and mandatory source selection.
        The endpoint resolves that local immutable row, then the installer obtains all
        registry/authentication/trust/image inputs from the configured source and server-owned
        adapters. The operation fails closed when the deployment has not configured all trusted
        installation adapters.
      operationId: install_catalog_plugin
      tags:
        - Plugin Platform
      x-app-permission:
        resource: plugin_registry
        action: install
      security:
        - bearerAuth: []
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 63
            pattern: "^[a-z][a-z0-9-]{0,62}$"
            title: Namespace
        - name: name
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 63
            pattern: "^[a-z][a-z0-9-]{0,62}$"
            title: Name
        - name: version
          in: path
          required: true
          schema:
            type: string
            minLength: 5
            maxLength: 128
            pattern: "^(?:0|[1-9][0-9]*)\\.[0-9]+\\.[0-9]+(?:-[0-9A-Za-z.-]+)?$"
            title: Version
        - name: source_id
          in: query
          required: true
          description: Stable catalog source identity selected by the administrator.
          schema:
            type: string
            minLength: 1
            maxLength: 63
            pattern: "^[a-z][a-z0-9-]{0,62}$"
            title: Source Id
      responses:
        "200":
          description: Catalog-selected plugin installed into the immutable active registry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogPluginInstallRead"
        "400": *bad_request
        "401": *unauthorized
        "403": *forbidden
        "404": *not_found
        "409": *conflict
        "422": *validation_error
        "429": *rate_limit
        "500": *internal_error
        "503":
          description: Plugin installation is unavailable until trusted installation adapters are configured.
          content:
            application/problem+json:
              schema:
                $ref: "../base/shared-resources.openapi.yaml#/components/schemas/ErrorData"

components:
  schemas:
    PluginSourceCreate:
      type: object
      title: PluginSourceCreate
      description: Request body for registering one local catalog source.
      additionalProperties: false
      required:
        - display_name
        - registry_origin
        - index_repository
        - channel
        - repository_scopes
        - credential_ref
        - trust_policy_ref
        - source_id
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 128
          title: Display Name
        source_mode:
          type: string
          enum:
            - standard
            - local-poc
          title: Source Mode
          description: Standard production source or the explicit unsafe local-PoC source.
          default: standard
        registry_origin:
          type: string
          minLength: 9
          maxLength: 512
          title: Registry Origin
        index_repository:
          type: string
          minLength: 1
          maxLength: 255
          title: Index Repository
        channel:
